server {
    listen 80;
    server_name www.caminhosanto.com;

    root /home/deployer/ics_onesite;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Bloquear acesso ao .git
    location ~ /\.git {
        deny all;
    }

    # Logging
    access_log /var/log/nginx/caminhosanto.com.access.log;
    error_log /var/log/nginx/caminhosanto.com.error.log;
}

server {
    listen 80;
    server_name caminhosanto.com;
    return 301 http://www.caminhosanto.com$request_uri;
}
